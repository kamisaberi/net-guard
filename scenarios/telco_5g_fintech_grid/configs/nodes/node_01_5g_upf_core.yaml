# File: /home/kami/net-guard/scenarios/telco_5g_fintech_grid/configs/nodes/node_01_5g_upf_core.yaml

node:
  identifier: "Edge-5G-UPF-01"
  site_identifier: "Edge-5G-UPF-01"
  hardware:
    type: "DEVICE_VIRTUAL_TPM"
    primary_backend: "INTEL_OPENVINO"
    xdp_driver_mode: "SKB"

nexus:
  enabled: true
  host: "10.240.60.10"
  port: 50051
  nexus_http_port: 9443
  active_model_name: "network_threat_int8.onnx"
  local_models_dir: "/etc/sentinel/models"

routes:
  - sensor_id: UPF-GTPU-Ingress-01
    sensor_type: 5G_GTPU_SLICE
    driver_mode: AF_XDP_UMEM
    match:
      port: 2152
      transport: udp
      package_id: org.aryorithm.package.gtpu_slice_guard
      plugin_id: net_guard_dissector_plugin.so
      owner_subsystem: 03_ndr
      execution_mode: CASCADE_SHORT_CIRCUIT
      model_id: network_threat_int8.onnx
      silicon_target: INTEL_OPENVINO
      format: ONNX
      precision: INT8
      latency_budget_ns: 12000
      threshold_drop: 0.85

  - sensor_id: ORAN-RIC-E2-02
    sensor_type: ORAN_E2_SCTP
    driver_mode: AF_XDP_UMEM
    match:
      port: 36422
      transport: sctp
      package_id: org.aryorithm.package.oran_e2_wasm
      plugin_id: net_guard_dissector_plugin.so
      owner_subsystem: 03_ndr
      execution_mode: CASCADE_SHORT_CIRCUIT
      model_id: network_threat_int8.onnx
      silicon_target: INTEL_OPENVINO
      format: ONNX
      precision: INT8
      latency_budget_ns: 15000
      threshold_drop: 0.85